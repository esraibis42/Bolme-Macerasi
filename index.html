<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bölme İşlemi Keşfi</title>
    <!-- Tasarım ve Animasyon Kütüphaneleri -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* İşaretleme İlkesi: Zihinsel Eşleşme İçin Renk Kodları */
        .bolunen { color: #3b82f6; font-weight: bold; } /* Mavi */
        .bolen { color: #ef4444; font-weight: bold; } /* Kırmızı */
        .bolum { color: #22c55e; font-weight: bold; } /* Yeşil */
    </style>
</head>
<body class="bg-blue-50 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full text-center border-t-4 border-blue-400">
        <h1 class="text-2xl font-bold text-gray-700 mb-6">Bölme Macerası 🚀</h1>
        
        <!-- Seviye Seçimi -->
        <div class="mb-4">
            <select id="level" class="p-2 border rounded-lg w-full text-gray-600 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-400" onchange="yeniSoru()">
                <option value="kolay">Başlangıç (2 Basamaklı)</option>
                <option value="orta">Orta (3 Basamaklı)</option>
            </select>
        </div>

        <!-- Seri Takibi -->
        <div class="text-sm font-semibold text-orange-500 mb-4 bg-orange-100 p-2 rounded-lg">
            🔥 Arka Arkaya Doğru: <span id="seri">0</span>
        </div>

        <!-- İşlem Tahtası -->
        <div class="text-4xl mb-6 flex justify-center items-center space-x-4">
            <span id="bolunenGosterge" class="bolunen"></span>
            <span class="text-gray-400">÷</span>
            <span id="bolenGosterge" class="bolen"></span>
            <span class="text-gray-400">=</span>
            <span class="bolum">?</span>
        </div>

        <!-- Yönlendirici Dönüt Alanı -->
        <div id="mesaj" class="text-lg font-medium text-gray-600 mb-4 h-16 flex items-center justify-center">
            İşlemin sonucunu aşağıya yaz!
        </div>

        <!-- Girdi Alanı ve Butonlar -->
        <input type="number" id="cevap" class="w-full text-center text-2xl p-3 border-2 rounded-xl mb-4 focus:outline-none focus:border-green-400" placeholder="Bölüm kaçtır?">
        
        <button onclick="kontrolEt()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-4 rounded-xl transition duration-200 text-lg shadow-md mb-3">
            Kontrol Et ✔️
        </button>
        <button onclick="yeniSoru()" class="w-full bg-blue-400 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded-xl transition duration-200 text-md shadow-sm">
            Yeni Soru 🔄
        </button>
    </div>

    <!-- İşlem Mantığı ve Tuş Fonksiyonları -->
    <script>
        let mevcutBolunen = 0;
        let mevcutBolen = 0;
        let dogruCevap = 0;
        let seri = 0;

        function yeniSoru() {
            const seviye = document.getElementById("level").value;
            document.getElementById("cevap").value = "";
            
            if(seviye === "kolay") {
                mevcutBolen = Math.floor(Math.random() * 8) + 2; // 2 ile 9 arası bölen
                dogruCevap = Math.floor(Math.random() * 9) + 1;  // 1 ile 9 arası bölüm
                mevcutBolunen = mevcutBolen * dogruCevap;
            } else {
                mevcutBolen = Math.floor(Math.random() * 8) + 2; 
                dogruCevap = Math.floor(Math.random() * 90) + 10; // 10 ile 99 arası bölüm
                mevcutBolunen = mevcutBolen * dogruCevap;
            }

            document.getElementById("bolunenGosterge").innerText = mevcutBolunen;
            document.getElementById("bolenGosterge").innerText = mevcutBolen;
            
            // Soru cümlesini renklendirerek kur
            document.getElementById("mesaj").innerHTML = "Sence <span class='bolunen'>" + mevcutBolunen + "</span> sayısının içinde kaç tane <span class='bolen'>" + mevcutBolen + "</span> var?";
            document.getElementById("mesaj").style.color = "#4b5563"; 
        }

        function kontrolEt() {
            const kullaniciCevabi = parseInt(document.getElementById("cevap").value);
            const mesajAlani = document.getElementById("mesaj");

            if (isNaN(kullaniciCevabi)) {
                mesajAlani.innerText = "Lütfen bir sayı gir! 🤔";
                mesajAlani.style.color = "#f59e0b"; 
                return;
            }

            if (kullaniciCevabi === dogruCevap) {
                mesajAlani.innerHTML = "Harika! Doğru bildin. 🎉";
                mesajAlani.style.color = "#22c55e"; 
                seri++;
                document.getElementById("seri").innerText = seri;
                
                // Başarı anında konfeti patlat
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });

                // 3 saniye bekleyip yeni soruya geç
                setTimeout(yeniSoru, 3000); 
            } else {
                seri = 0; // Hata yaparsa seri sıfırlanır
                document.getElementById("seri").innerText = seri;
                
                // Pedagojik, yumuşak hata dönütleri
                if (kullaniciCevabi > dogruCevap) {
                    mesajAlani.innerHTML = "Biraz fazla söyledin. <span class='bolunen'>" + mevcutBolunen + "</span>'in içine sığması için daha küçük bir sayı düşünmelisin! 👇";
                } else {
                    mesajAlani.innerHTML = "Biraz az oldu sanki. İçinde daha fazla <span class='bolen'>" + mevcutBolen + "</span> var, tekrar dene! 👇";
                }
                mesajAlani.style.color = "#ef4444"; 
            }
        }

        // Sayfa ilk açıldığında otomatik soru üret
        window.onload = yeniSoru;
    </script>
</body>
</html>
