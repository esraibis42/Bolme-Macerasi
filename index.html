<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Step-by-Step Division Practice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', sans-serif;
            background-color: #f8fafc;
        }
        .math-font {
            font-family: 'JetBrains Mono', monospace;
        }
        
        /* Grid cell for alignment */
        .digit-cell {
            width: 2rem;
            height: 2.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 0.375rem;
            transition: all 0.3s ease;
        }

        /* Signaling Colors */
        .highlight-divisor {
            background-color: #fef08a; /* Yellow */
            color: #854d0e;
            box-shadow: 0 0 0 2px #fde047;
        }
        .highlight-dividend {
            background-color: #bfdbfe; /* Blue */
            color: #1e3a8a;
            box-shadow: 0 0 0 2px #93c5fd;
        }
        .highlight-quotient {
            background-color: #bbf7d0; /* Green */
            color: #14532d;
            box-shadow: 0 0 0 2px #86efac;
        }

        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .division-bracket {
            border-left: 3px solid #1e293b;
            border-top: 3px solid #1e293b;
            border-top-left-radius: 0.5rem;
        }
        
        .underline-math {
            border-bottom: 3px solid #475569;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col items-center py-10 px-4">

    <div class="max-w-4xl w-full bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
        
        <!-- Header -->
        <div class="bg-indigo-600 p-6 text-center text-white">
            <h1 class="text-3xl font-bold tracking-wide">Long Division Explorer 🚀</h1>
            <p class="text-indigo-200 mt-2 font-medium">Master division one step at a time!</p>
        </div>

        <!-- Setup Area -->
        <div id="setup-area" class="p-8 bg-slate-50 border-b border-slate-200 flex flex-col md:flex-row items-center justify-center gap-6">
            <div class="flex items-center gap-3">
                <label class="font-semibold text-slate-600">Dividend (Inside):</label>
                <input type="number" id="input-dividend" min="10" max="9999" value="452" class="w-24 px-3 py-2 text-xl font-bold text-center border-2 border-slate-300 rounded-xl focus:border-indigo-500 focus:outline-none">
            </div>
            <div class="text-3xl font-bold text-slate-400">÷</div>
            <div class="flex items-center gap-3">
                <label class="font-semibold text-slate-600">Divisor (Outside):</label>
                <input type="number" id="input-divisor" min="2" max="9" value="3" class="w-20 px-3 py-2 text-xl font-bold text-center border-2 border-slate-300 rounded-xl focus:border-indigo-500 focus:outline-none">
            </div>
            <button onclick="startPractice()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform active:scale-95">
                Start Playing!
            </button>
        </div>

        <!-- Practice Area (Hidden initially) -->
        <div id="practice-area" class="hidden p-6 md:p-10 flex flex-col md:flex-row gap-10">
            
            <!-- Left: Math Board -->
            <div class="flex-1 flex flex-col items-center justify-start overflow-x-auto bg-slate-50 rounded-2xl p-6 border-2 border-dashed border-slate-200">
                <div id="math-board" class="math-font text-slate-800 flex flex-col items-end whitespace-nowrap">
                    <!-- Dynamic Grid Content -->
                </div>
            </div>

            <!-- Right: Interactive Panel -->
            <div class="flex-1 flex flex-col gap-6">
                <!-- Instruction Box -->
                <div class="bg-blue-50 border-2 border-blue-200 rounded-2xl p-6 shadow-sm">
                    <h2 class="text-blue-800 font-bold text-xl mb-2 flex items-center gap-2">
                        <span>📝</span> <span id="step-title">Current Step</span>
                    </h2>
                    <p id="instruction-text" class="text-slate-700 text-lg leading-relaxed">
                        Click start to begin the step-by-step process.
                    </p>
                </div>

                <!-- Input Box -->
                <div id="input-section" class="bg-white border-2 border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col items-center gap-4 hidden">
                    <input type="number" id="student-answer" class="w-32 h-16 text-center text-3xl font-bold border-4 border-slate-200 rounded-xl focus:border-indigo-400 focus:outline-none transition-colors" placeholder="?">
                    
                    <button onclick="checkAnswer()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-4 px-8 rounded-xl shadow-md transition-transform active:scale-95 text-xl">
                        Check Answer ✔️
                    </button>
                    
                    <div id="feedback-message" class="text-center font-bold text-lg h-6"></div>
                </div>

                <!-- Success Box -->
                <div id="success-section" class="hidden bg-green-100 border-2 border-green-300 rounded-2xl p-6 shadow-sm text-center">
                    <h2 class="text-green-800 font-bold text-2xl mb-2">🎉 Puzzle Solved!</h2>
                    <p id="final-result-text" class="text-green-700 text-lg font-medium mb-4"></p>
                    <button onclick="resetApp()" class="bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-8 rounded-xl shadow-md transition-transform active:scale-95">
                        Try Another One
                    </button>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // --- State Variables ---
        let dividendStr = "";
        let divisorNum = 0;
        let steps = [];
        
        let currentStepIndex = 0;
        let currentSubStep = 'divide'; // 'divide' or 'subtract'
        
        // DOM Elements
        const setupArea = document.getElementById('setup-area');
        const practiceArea = document.getElementById('practice-area');
        const mathBoard =
